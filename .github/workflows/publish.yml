name: Publish to pub.dev (OIDC) + signed source archive

# Runs on a release tag created by release-tag.yml (v<version>, the tag pattern pub.dev automated
# publishing is configured with). It proves the tag commit is the reviewed head of a merged pull request,
# checks its commit identity and scans its tree for secrets, analyzes it, checks that the pub.dev publish
# set is exactly the committed tree, signs and attests the source archive and its SBOM, packs the publish
# set from the git objects of the tag commit and uploads it to pub.dev with a GitHub Actions OIDC token (no
# stored pub.dev credential) from a job that runs no Flutter tooling and receives no file from another job,
# reads the version back from pub.dev, and publishes the signed assets as the GitHub Release of the tag.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reviewed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Assert the repository is public on a durable sha
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPO: rakomidev/rakomi-flutter
        run: |
          set -euo pipefail
          VIS="$(gh repo view "${EXPECTED_REPO}" --json visibility --jq '.visibility')"
          if [ "${VIS}" != "PUBLIC" ]; then
            echo "ERROR: repository visibility is '${VIS}', not PUBLIC"
            exit 1
          fi
          if [ "${#GITHUB_SHA}" -ne 40 ]; then
            echo "ERROR: no durable 40-hex commit sha for this release"
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Assert the tag commit is the reviewed head merged into the default branch
        env:
          TAG_REF: ${{ github.ref }}
          TAG_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/check-release-tag-reviewed.mjs

      - name: Assert the tag names the version and SBOM of the tag commit
        id: version
        env:
          TAG_REF: ${{ github.ref }}
          TAG_SHA: ${{ github.sha }}
        run: node .github/scripts/release-tag-version.mjs

      # The commit the tag points at is signed into a public transparency log below: refuse a personal
      # address in its identity, and refuse a secret anywhere in its tree, before any signing step.
      - name: Commit identity of the tag commit (release role mailbox only)
        run: node .github/scripts/check-build-identity.mjs --ref "${GITHUB_SHA}"

      # The sha256 is the release's own published checksum, pinned here (not read from the release at run
      # time): https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
      - name: Install gitleaks (pinned version and release checksum)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          TGZ="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${TGZ}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TGZ}"
          echo "${GITLEAKS_SHA256}  ${TGZ}" | sha256sum -c -
          tar -xzf "${TGZ}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Refuses a .gitleaksignore or an inline allow marker anywhere in the tree before gitleaks runs.
      - name: Secret scan of the tag commit tree (gitleaks, default rules, no suppressions, fails closed)
        run: node .github/scripts/secret-scan-tree.mjs --ref "${GITHUB_SHA}"

  verify:
    needs: reviewed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.41.7"
          cache: false

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib example

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: The pub.dev publish set is exactly the committed tree
        run: node .github/scripts/pub-publish.mjs check-set

  # Signing runs in its own environment `release-sign`: its id-token can sign and attest, but a token minted
  # here never satisfies a registry that trusts the environment `release` (pub.dev automated publishing).
  sign:
    needs: [reviewed, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-sign
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Source archive of the tag commit, its SBOM and checksums
        env:
          VERSION: ${{ needs.reviewed.outputs.version }}
        run: |
          set -euo pipefail
          DIST="${RUNNER_TEMP}/dist"
          mkdir -p "${DIST}"
          git archive --format=tar.gz --prefix="rakomi_flutter-${VERSION}/" -o "${DIST}/rakomi_flutter-${VERSION}.tar.gz" "${GITHUB_SHA}"
          cp sbom.cdx.json "${DIST}/rakomi_flutter-${VERSION}.cdx.json"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the archive and the SBOM (keyless; the bundle carries the transparency-log entry)
        env:
          VERSION: ${{ needs.reviewed.outputs.version }}
        working-directory: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          for F in "rakomi_flutter-${VERSION}.tar.gz" "rakomi_flutter-${VERSION}.cdx.json"; do
            cosign sign-blob --yes --bundle "${F}.sigstore.json" "${F}"
          done
          sha256sum -- * > SHA256SUMS

      - name: Attest build provenance of the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/rakomi_flutter-${{ needs.reviewed.outputs.version }}.tar.gz

      - name: Attest the SBOM of the archive
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/dist/rakomi_flutter-${{ needs.reviewed.outputs.version }}.tar.gz
          sbom-path: ${{ runner.temp }}/dist/rakomi_flutter-${{ needs.reviewed.outputs.version }}.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/dist
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: [reviewed, verify, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # The only job that can mint the pub.dev token runs only Node and git: no Flutter toolchain, no
      # dependency resolution, and no file from another job. It packs the archive itself from the git
      # objects of the tag commit (regular files only, each path once; a symlink, a submodule or a
      # repeated path is refused), checks it is exactly the package files of the tag commit, and uploads
      # that archive.
      - name: Pack the publish set from the git objects of the tag commit
        run: node .github/scripts/pub-publish.mjs pack "${RUNNER_TEMP}/package.tar.gz"

      - name: The archive is exactly the package files of the tag commit
        run: node .github/scripts/pub-publish.mjs verify-archive "${RUNNER_TEMP}/package.tar.gz"

      - name: Publish to pub.dev (OIDC id-token, audience https://pub.dev)
        run: node .github/scripts/pub-publish.mjs upload "${RUNNER_TEMP}/package.tar.gz"

      - name: Read the version back from pub.dev
        env:
          VERSION: ${{ needs.reviewed.outputs.version }}
        run: node .github/scripts/pub-publish.mjs read-back rakomi_flutter "${VERSION}"

  release:
    needs: [reviewed, sign, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/dist

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create the GitHub Release of the tag (never creates or moves a tag)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.reviewed.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "release ${TAG} exists; reading it back"
            exit 0
          fi
          gh release create "${TAG}" --repo "${REPO}" --verify-tag \
            --title "rakomi_flutter ${VERSION}" \
            --notes "rakomi_flutter ${VERSION}, published to pub.dev from the tag ${TAG}. Assets: the source archive of the tag commit, its CycloneDX SBOM, Sigstore bundles for both and SHA256SUMS. How to verify them: .github/VERIFY.md." \
            "${RUNNER_TEMP}/dist"/*

      - name: Read the release back and verify it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.reviewed.outputs.version }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          RB="${RUNNER_TEMP}/read-back"
          mkdir -p "${RB}"
          gh release download "${TAG}" --repo "${REPO}" --dir "${RB}"
          (cd "${RB}" && sha256sum -c "${RUNNER_TEMP}/dist/SHA256SUMS")
          PEELED="$(git ls-remote "https://github.com/${REPO}.git" "refs/tags/${TAG}^{}" | cut -f1)"
          if [ "${PEELED}" != "${GITHUB_SHA}" ]; then
            echo "ERROR: tag ${TAG} no longer points at ${GITHUB_SHA}"
            exit 1
          fi
          IDENTITY="https://github.com/${WORKFLOW_REF}"
          for F in "rakomi_flutter-${VERSION}.tar.gz" "rakomi_flutter-${VERSION}.cdx.json"; do
            cosign verify-blob --bundle "${RB}/${F}.sigstore.json" \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${RB}/${F}"
          done
          gh attestation verify "${RB}/rakomi_flutter-${VERSION}.tar.gz" --repo "${REPO}" --signer-workflow "${REPO}/.github/workflows/publish.yml"
          echo "release ${TAG} verified: assets, tag, signatures, attestation"
