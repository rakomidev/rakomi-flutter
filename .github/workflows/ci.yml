name: CI

# Pull requests (including release pull requests) and pushes to main: format, analyze, test, the pub.dev
# publish set, and check that the release scripts load.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.41.7"
          cache: false

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib example

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      # Before the tests: `flutter test` writes build/, which is not in the committed tree.
      - name: The pub.dev publish set is exactly the committed tree
        run: node .github/scripts/pub-publish.mjs check-set

      - name: Test
        run: flutter test

  release-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: The release scripts load and the declared version matches the SBOM
        run: |
          set -euo pipefail
          for F in .github/scripts/*.mjs .github/scripts/lib/*.mjs; do node --check "${F}"; done
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            import { SURFACE, readDeclaredVersion, sbomViolations } from './.github/scripts/lib/release-source-surface.mjs'
            const v = readDeclaredVersion(readFileSync(SURFACE.versionFile, 'utf8'))
            const bad = v ? sbomViolations(readFileSync(SURFACE.sbom, 'utf8'), v) : ['no declared version']
            if (bad.length) { console.error(bad.join('\n')); process.exit(1) }
            console.log(SURFACE.package + ' ' + v)
          "
